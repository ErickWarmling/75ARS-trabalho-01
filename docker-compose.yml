services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 75ARS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 75ARS"]
      interval: 5s
      timeout: 5s
      retries: 10

  tutor:
    build: ./tutor
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/75ARS
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/tutores || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  animal:
    build: ./animal
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/75ARS
      TUTOR_API_URL: http://tutor:8080/api
    depends_on:
      postgres:
        condition: service_healthy
      tutor:
        condition: service_healthy

volumes:
  postgres_data:
